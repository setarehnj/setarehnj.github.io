````{=html}
<div class="feature-grid-wrap">
  <div class="feature-grid" id="feature-grid" role="group" aria-label="Featured writing, shown as active features"></div>
  <div class="feature-readout">
    <span id="feature-label">Each active feature is a piece of writing. Hover one.</span>
    <span id="feature-index">— / —</span>
  </div>
</div>

<script>
(function () {
  var grid = document.getElementById('feature-grid');
  if (!grid) return;
  var label = document.getElementById('feature-label');
  var index = document.getElementById('feature-index');

  // Edit this list as you publish. href points at the post.
  var features = [
    { pos: 'neg', kind: 'Paper note', title: 'What sparse autoencoders don\u2019t tell you about a circuit', href: 'writing/2026-08-11-sae-limits/' },
    { pos: 'pos', kind: 'Review',     title: 'Chain-of-thought faithfulness: a reading list', href: 'writing/' },
    { pos: 'neg', kind: 'Preprint',   title: 'Unlearning as targeted ablation', href: 'writing/' },
    { pos: 'pos', kind: 'Notebook',   title: 'Probing a small model\u2019s arithmetic, badly, on purpose', href: 'writing/' },
    { pos: 'neg', kind: 'Insight',    title: 'Why your ablation baseline is probably wrong', href: 'insights/' },
    { pos: 'pos', kind: 'Insight',    title: 'A one-GPU setup for interpretability experiments', href: 'insights/2026-08-02-one-gpu-setup/' }
  ];

  var cols = window.matchMedia('(max-width: 860px)').matches ? 16 : 24;
  var total = cols * 5;

  var slots = [];
  while (slots.length < features.length) {
    var n = Math.floor(Math.random() * total);
    if (slots.indexOf(n) === -1) slots.push(n);
  }
  slots.sort(function (a, b) { return a - b; });

  for (var i = 0; i < total; i++) {
    var s = slots.indexOf(i);
    var el;
    if (s === -1) {
      el = document.createElement('div');
      el.className = 'cell';
      el.setAttribute('aria-hidden', 'true');
    } else {
      var f = features[s];
      el = document.createElement('a');
      el.className = 'cell on ' + f.pos;
      el.href = f.href;
      el.setAttribute('aria-label', f.kind + ': ' + f.title);
      el.dataset.title = f.title;
      el.dataset.kind = f.kind;
      el.dataset.n = s + 1;
    }
    grid.appendChild(el);
  }

  function show(e) {
    var t = e.target;
    if (!t.dataset || !t.dataset.title) return;
    label.innerHTML = '<strong>' + t.dataset.title + '</strong>';
    index.textContent = t.dataset.kind + ' · ' + t.dataset.n + ' / ' + features.length;
  }
  function clear() {
    label.textContent = 'Each active feature is a piece of writing. Hover one.';
    index.textContent = '— / —';
  }
  grid.addEventListener('mouseover', show);
  grid.addEventListener('focusin', show);
  grid.addEventListener('mouseleave', clear);
  grid.addEventListener('focusout', clear);

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var cells = grid.children;
    for (var k = 0; k < cells.length; k++) {
      cells[k].style.transform = 'scale(0)';
      cells[k].style.opacity = '0';
    }
    requestAnimationFrame(function () {
      for (var j = 0; j < cells.length; j++) {
        (function (c, m) {
          setTimeout(function () { c.style.transform = ''; c.style.opacity = ''; }, 8 * m);
        })(cells[j], j);
      }
    });
  }
})();
</script>
````
