project:
  type: website
  output-dir: _site

website:
  title: "Setareh Najafi"
  description: "Research notes on AI safety, interpretability and reasoning."
  site-url: "https://setarehnj.github.io" 
  favicon: ""
  navbar:
    pinned: true
    left:
      - text: "Scientific writing"
        href: writing.qmd
      - text: "Tech insights"
        href: insights.qmd
    right:
      - icon: github
        href: "https://github.com/setarehnj"
        aria-label: GitHub
      - icon: mortarboard-fill
        href: "https://scholar.google.com/citations?user=YOURID"
        aria-label: Google Scholar
      - icon: linkedin
        href: "https://www.linkedin.com/in/setareh-najafi-023870273/"
        aria-label: LinkedIn
      - icon: envelope
        href: "mailto:setareh@ucsb.edu"
        aria-label: Email
  page-footer:
    left: "© 2026 Setareh"
    right: "Built with Quarto · Set in Bricolage Grotesque & Source Serif 4"
  open-graph: true
  twitter-card: true

format:
  html:
    theme: [default, styles.scss]
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    anchor-sections: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    fig-cap-location: bottom
    link-external-newwindow: true
    citations-hover: true

bibliography: references.bib
csl: https://www.zotero.org/styles/apa

execute:
  freeze: auto   # posts render once, then get cached — keeps builds fast
